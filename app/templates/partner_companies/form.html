{% extends "base.html" %}

{% block title %}{{ 'Sửa công ty' if company else 'Thêm công ty' }}{% endblock %}
{% block page_title %}{{ 'Sửa công ty' if company else 'Thêm công ty' }}{% endblock %}

{% block content %}
<form method="post" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="card-body row g-3">
    <div class="col-md-6">
      <label class="form-label">Tên công ty <span class="text-danger">*</span></label>
      <input class="form-control {% if errors.get('name') %}is-invalid{% endif %}" name="name" value="{{ request.form.get('name', company.name if company else '') }}">
      {% if errors.get('name') %}<div class="invalid-feedback">{{ errors.name }}</div>{% endif %}
    </div>
    <div class="col-md-6"><label class="form-label">Ngành</label><input class="form-control" name="industry" value="{{ request.form.get('industry', company.industry if company else '') }}"></div>
    <div class="col-md-4"><label class="form-label">Điện thoại</label><input class="form-control" name="phone" value="{{ request.form.get('phone', company.phone if company else '') }}"></div>
    <div class="col-md-4"><label class="form-label">Email</label><input class="form-control" type="email" name="email" value="{{ request.form.get('email', company.email if company else '') }}"></div>
    <div class="col-md-4"><label class="form-label">Website</label><input class="form-control" name="website" value="{{ request.form.get('website', company.website if company else '') }}"></div>
    <div class="col-md-6"><label class="form-label">Địa chỉ</label><textarea class="form-control" name="address" rows="3">{{ request.form.get('address', company.address if company else '') }}</textarea></div>
    <div class="col-md-6"><label class="form-label">Ghi chú</label><textarea class="form-control" name="notes" rows="3">{{ request.form.get('notes', company.notes if company else '') }}</textarea></div>
    <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" name="is_active" {% if not company or company.is_active %}checked{% endif %}><label class="form-check-label">Đang hoạt động</label></div></div>
  </div>
  <div class="card-footer bg-white d-flex justify-content-end gap-2">
    <a class="btn btn-outline-secondary" href="{{ url_for('partner_companies.index') }}">Quay lại</a>
    <button class="btn btn-primary" type="submit">Lưu công ty</button>
  </div>
</form>
{% endblock %}
