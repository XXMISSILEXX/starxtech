{% extends "base.html" %}{% block page_title %}{{ 'Sửa' if update else 'Thêm' }} cập nhật — {{ project.name }}{% endblock %}{% block content %}
<form method="post" action="{{ url_for('project_operations.project_update_edit', update_id=update.id) if update else url_for('project_operations.project_update_create', project_id=project.id) }}" class="card card-body gap-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Loại<select class="form-select" name="update_type">{% for type in types %}<option value="{{ type.value }}" {% if update and update.update_type == type.value %}selected{% endif %}>{{ type.value }}</option>{% endfor %}</select></label><label>Nhà thầu/assignment{% if locked_assignment %}<input class="form-control" readonly value="{{ locked_assignment.contractor.name }} / {{ locked_assignment.role }}"><input type="hidden" name="contractor_assignment_id" value="{{ locked_assignment.id }}">{% else %}<select class="form-select" name="contractor_assignment_id"><option value="">Cập nhật chung</option>{% for assignment in assignments %}<option value="{{ assignment.id }}">{{ assignment.contractor.name }} / {{ assignment.role }}</option>{% endfor %}</select>{% endif %}</label><label>Ngày<input class="form-control" required type="date" name="update_date" value="{{ update.update_date if update else '' }}"></label><label>Tiêu đề<input class="form-control" required name="title" value="{{ update.title if update else '' }}"></label><label>Nội dung<textarea class="form-control" required name="content">{{ update.content if update else '' }}</textarea></label><button class="btn btn-primary">Lưu</button></form>{% endblock %}
