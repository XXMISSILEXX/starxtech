{% extends "base.html" %}
{% block title %}{{ 'Sửa khách hàng' if customer else 'Tạo khách hàng' }} - StarX{% endblock %}
{% block page_title %}{{ 'Sửa khách hàng' if customer else 'Tạo khách hàng' }}{% endblock %}
{% block content %}<form method="post" class="form-card row g-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="col-12"><label class="form-label">Tên khách hàng</label><input class="form-control" name="name" required value="{{ request.form.get('name', customer.name if customer else '') }}"></div><div class="col-12"><label class="form-label">Mô tả</label><textarea class="form-control" name="description">{{ request.form.get('description', customer.description if customer and customer.description else '') }}</textarea></div><div><button class="btn btn-primary">Lưu</button><a class="btn btn-outline-secondary" href="{{ url_for('customers.index') }}">Hủy</a></div></form>{% endblock %}
