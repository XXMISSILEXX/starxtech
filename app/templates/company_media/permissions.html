{% extends 'base.html' %}{% block content %}<h2>Chia sẻ album: {{album.name}}</h2><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><select name="principal_type"><option value="user">Người dùng</option><option value="role">Vai trò</option></select><input name="principal_id" required placeholder="ID"><label><input type="checkbox" name="can_view" value="1">Xem</label><label><input type="checkbox" name="can_download" value="1">Tải</label><label><input type="checkbox" name="can_upload" value="1">Upload</label><label><input type="checkbox" name="can_edit" value="1">Sửa</label><label><input type="checkbox" name="can_delete" value="1">Lưu trữ</label><label><input type="checkbox" name="can_share" value="1">Chia sẻ</label><button>Thêm/cập nhật</button></form><ul>{%for e in entries%}<li>{{e.principal_type}} #{{e.user_id or e.role_id}} <form class="d-inline" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input type="hidden" name="remove_id" value="{{e.id}}"><button>Gỡ</button></form></li>{%endfor%}</ul>{%endblock%}
