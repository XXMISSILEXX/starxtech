{% extends "base.html" %}
{% block title %}Vai trò tùy chỉnh - StarX{% endblock %}
{% block page_title %}{{ 'Sửa vai trò' if role else 'Tạo vai trò tùy chỉnh' }}{% endblock %}
{% block content %}<form method="post" class="form-card row g-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="col-md-6"><label class="form-label">Mã vai trò</label><input class="form-control" name="code" required value="{{ role.code if role else request.form.get('code','') }}" {% if role %}readonly{% endif %}></div><div class="col-md-6"><label class="form-label">Tên</label><input class="form-control" name="name" required value="{{ role.name if role else request.form.get('name','') }}"></div><div class="col-12"><label class="form-label">Mô tả</label><textarea class="form-control" name="description">{{ role.description if role else request.form.get('description','') }}</textarea></div><div><button class="btn btn-primary">Lưu</button><a class="btn btn-outline-secondary" href="{{ url_for('admin.roles_index') }}">Hủy</a></div></form>{% endblock %}
