{% extends "base.html" %}{% block title %}Nhận diện hệ thống{% endblock %}{% block page_title %}Nhận diện hệ thống{% endblock %}{% block content %}<form class="card" method="post" enctype="multipart/form-data"><div class="card-body" data-display-image-picker><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Logo hiện tại</label><div data-display-image-preview class="display-image-preview-circle mb-3">{% if branding.logo_url %}<img src="{{ branding.logo_url }}" alt="Logo hiện tại" decoding="async" width="128" height="128">{% else %}<span>SX</span>{% endif %}</div>{% if can_manage %}<label class="upload-dropzone d-block p-4 text-center" data-dropzone for="branding-logo"><input class="visually-hidden" id="branding-logo" type="file" name="logo" accept=".jpg,.jpeg,.png,.webp,.heic,.heif" data-file-input><span class="upload-title">Kéo thả logo hoặc bấm để chọn</span></label><div data-picker-status class="small text-muted mt-2"></div><button class="btn btn-outline-secondary btn-sm mt-2" type="button" data-remove-selection>Bỏ lựa chọn</button><div class="form-check mt-3"><input class="form-check-input" type="checkbox" name="remove_logo" value="1" id="remove_logo"><label class="form-check-label" for="remove_logo">Khôi phục logo mặc định</label></div><button class="btn btn-primary mt-3">Lưu</button>{% endif %}</div></form>{% endblock %}
