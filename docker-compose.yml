name: starx-report

x-app-environment: &app-environment
  APP_ENV: production
  FLASK_DEBUG: "false"
  APP_PORT: "6655"
  SECRET_KEY_FILE: /run/secrets/app_secret_key
  DATABASE_URL_FILE: /run/secrets/database_url
  STORAGE_ACCESS_KEY_ID_FILE: /run/secrets/storage_access_key_id
  STORAGE_SECRET_ACCESS_KEY_FILE: /run/secrets/storage_secret_access_key
  STORAGE_PROVIDER: s3
  STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:?Set the HTTPS S3-compatible endpoint}
  STORAGE_BUCKET: ${STORAGE_BUCKET:?Set the private S3 bucket name}
  STORAGE_REGION: ${STORAGE_REGION:?Set the S3 region}
  STORAGE_PREFIX: ${STORAGE_PREFIX:-starx-report}
  STORAGE_CORS_ALLOWED_ORIGINS: ${STORAGE_CORS_ALLOWED_ORIGINS:?Set HTTPS application origins}
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  REDIS_HOST: redis
  SESSION_COOKIE_SECURE: "true"
  SESSION_COOKIE_HTTPONLY: "true"
  SESSION_COOKIE_SAMESITE: Lax
  TRUST_PROXY_HOPS: "1"
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:?Set the Nginx public hostname}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
  GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
  GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
  GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}
  REPORT_UPLOAD_CLEANUP_INTERVAL_SECONDS: ${REPORT_UPLOAD_CLEANUP_INTERVAL_SECONDS:-3600}
  MEDIA_RECONCILIATION_INTERVAL_SECONDS: ${MEDIA_RECONCILIATION_INTERVAL_SECONDS:-900}
  BULK_DOWNLOAD_CLEANUP_INTERVAL_SECONDS: ${BULK_DOWNLOAD_CLEANUP_INTERVAL_SECONDS:-3600}
  COMPANY_MEDIA_MAX_SELECTION_FILES: ${COMPANY_MEDIA_MAX_SELECTION_FILES:-500}
  COMPANY_MEDIA_MAX_SELECTION_BYTES: ${COMPANY_MEDIA_MAX_SELECTION_BYTES:-2147483648}
  COMPANY_MEDIA_MAX_FILES_PER_BATCH: ${COMPANY_MEDIA_MAX_FILES_PER_BATCH:-50}
  COMPANY_MEDIA_MAX_PRESIGN_BATCH_BYTES: ${COMPANY_MEDIA_MAX_PRESIGN_BATCH_BYTES:-536870912}
  COMPANY_MEDIA_MAX_FILE_BYTES: ${COMPANY_MEDIA_MAX_FILE_BYTES:-314572800}
  COMPANY_MEDIA_MAX_IMAGE_BYTES: ${COMPANY_MEDIA_MAX_IMAGE_BYTES:-52428800}
  COMPANY_MEDIA_MAX_VIDEO_BYTES: ${COMPANY_MEDIA_MAX_VIDEO_BYTES:-314572800}
  COMPANY_MEDIA_UPLOAD_CONCURRENCY: ${COMPANY_MEDIA_UPLOAD_CONCURRENCY:-3}
  COMPANY_MEDIA_UPLOAD_SESSION_TTL_SECONDS: ${COMPANY_MEDIA_UPLOAD_SESSION_TTL_SECONDS:-7200}
  TMPDIR: /app/tmp
  UPLOAD_ROOT: /app/storage/uploads
  TMP_ROOT: /app/tmp
  MEDIA_TEMP_ROOT: /app/tmp/media_processing
  BULK_DOWNLOAD_TEMP_ROOT: /app/tmp/bulk_downloads
  MEDIA_CACHE_ENABLED: "true"
  MEDIA_CACHE_ROOT: /app/cache/media
  MEDIA_CACHE_DELIVERY_MODE: ${MEDIA_CACHE_DELIVERY_MODE:-send_file}
  MEDIA_CACHE_X_ACCEL_PREFIX: /_protected_media_cache/
  MEDIA_CACHE_MAX_BYTES: ${MEDIA_CACHE_MAX_BYTES:-5368709120}
  MEDIA_CACHE_MAX_AGE_DAYS: ${MEDIA_CACHE_MAX_AGE_DAYS:-30}

x-app-common: &app-common
  image: ${APP_IMAGE:?Set APP_IMAGE to an immutable commit/version tag}
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  environment: *app-environment
  secrets:
    - app_secret_key
    - database_url
    - storage_access_key_id
    - storage_secret_access_key
    - redis_password
  volumes:
    - app_tmp:/app/tmp
  read_only: true
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - appnet
  logging: &bounded-logs
    driver: local
    options:
      max-size: "10m"
      max-file: "5"
  stop_grace_period: 45s

services:
  # The only migration owner.  It runs once per `docker compose up` and web,
  # worker, and Beat cannot start until it exits successfully.  It never seeds.
  migrate:
    <<: *app-common
    restart: "no"
    command: ["flask", "db", "upgrade"]
    depends_on:
      redis:
        condition: service_healthy

  web:
    <<: *app-common
    restart: unless-stopped
    command: ["gunicorn", "--config", "gunicorn.conf.py", "wsgi:app"]
    ports:
      - "127.0.0.1:${HOST_WEB_PORT:-6655}:6655"
    volumes:
      - app_tmp:/app/tmp
      - ${MEDIA_CACHE_HOST_ROOT:-/opt/starxtech/cache/media}:/app/cache/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6655/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    <<: *app-common
    restart: unless-stopped
    command: ["celery", "-A", "app.celery_worker:celery_app", "worker", "--loglevel=INFO", "--hostname=celery@%h", "-Q", "media_image,media_video,storage_cleanup,bulk_download"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/app/docker-entrypoint.sh celery -A app.celery_worker:celery_app inspect ping --destination=celery@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  scheduler:
    <<: *app-common
    restart: unless-stopped
    command: ["celery", "-A", "app.celery_worker:celery_app", "beat", "--loglevel=INFO", "--schedule=/app/tmp/celerybeat-schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Override the image's HTTP healthcheck: Beat has no HTTP listener.
    # `init: true` owns PID 1, so inspect /proc instead of assuming Beat is PID 1.
    healthcheck:
      test: ["CMD-SHELL", "for cmdline in /proc/[0-9]*/cmdline; do tr '\\000' ' ' < \"$$cmdline\" 2>/dev/null | grep -q 'celery.*beat' && exit 0; done; exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    init: true
    command: ["sh", "-ec", "exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *bounded-logs
    stop_grace_period: 30s

secrets:
  app_secret_key:
    file: ${SECRETS_DIR:?Set SECRETS_DIR to the protected host secret directory}/app_secret_key
  database_url:
    file: ${SECRETS_DIR:?Set SECRETS_DIR to the protected host secret directory}/database_url
  storage_access_key_id:
    file: ${SECRETS_DIR:?Set SECRETS_DIR to the protected host secret directory}/storage_access_key_id
  storage_secret_access_key:
    file: ${SECRETS_DIR:?Set SECRETS_DIR to the protected host secret directory}/storage_secret_access_key
  redis_password:
    file: ${SECRETS_DIR:?Set SECRETS_DIR to the protected host secret directory}/redis_password

volumes:
  app_tmp:
  redis_data:

networks:
  appnet:
    driver: bridge
